<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Advisory Bot</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#272b35; --text:#e6e8ec; --dim:#8b93a3;
    --me:#1e3a5f; --info:#5b6472; --advisory:#2f6feb; --warning:#c2700a; --danger:#c2341d;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .meta { color:var(--dim); font-size:13px; margin-left:auto; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
           padding:6px 10px; font-size:13px; cursor:pointer; }
  button:hover { border-color:#3a4050; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:10px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--me); }
  .bot  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .cite { margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:12.5px; color:var(--dim); }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; color:#fff; font-size:11px;
         font-weight:600; letter-spacing:.3px; text-transform:uppercase; margin-right:6px; }
  .none { color:var(--dim); font-style:italic; }
  details { margin-top:7px; } summary { cursor:pointer; color:var(--dim); font-size:12.5px; }
  table { border-collapse:collapse; margin-top:7px; font-size:12.5px; }
  td { padding:2px 12px 2px 0; color:var(--dim); } td.v { color:var(--text); font-variant-numeric:tabular-nums; }
  .warn { margin-top:7px; color:#e0913c; font-size:12.5px; }
  .choices { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .choices button { font-size:12.5px; padding:4px 9px; }
  form { display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text);
          border-radius:8px; padding:11px 13px; font-size:15px; }
  input:focus { outline:none; border-color:#3f4657; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Weather Advisory Bot</h1>
    <span class="meta" id="meta"></span>
    <button id="reset" title="Clears session memory">New session</button>
  </header>
  <div id="log"></div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Is it safe to cycle to work in Bhopal today?" maxlength="500" required>
    <button type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
let session = crypto.randomUUID();

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function add(cls, text) {
  const n = el('div', 'msg ' + cls, text);
  log.append(n);
  log.scrollTop = log.scrollHeight;
  return n;
}

function decorate(node, r) {
  if (r.choices?.length) {
    const row = el('div', 'choices');
    for (const c of r.choices) {
      const b = el('button', null, c);
      b.type = 'button';
      b.onclick = () => send(c);
      row.append(b);
    }
    node.append(row);
  }
  const box = el('div', 'cite');
  if (r.citation) {
    const tag = el('span', 'tag', r.citation.severity);
    tag.style.background = `var(--${r.citation.severity})`;
    box.append(tag, document.createTextNode(`${r.citation.id} — ${r.citation.title}`));
    if (r.also?.length) box.append(el('div', null, 'Also applies: ' + r.also.join(', ')));
  } else {
    box.append(el('span', 'none', `No SOP cited (${r.outcome})`));
  }
  if (r.guard_tripped?.length)
    box.append(el('div', 'warn', 'Model invented a number — fell back to the policy template.'));
  const w = r.weather?.values;
  if (w && Object.keys(w).length) {
    const d = el('details'), t = el('table');
    d.append(el('summary', null, `Live readings — ${r.weather.place} (${r.weather.observed_at})`));
    for (const [k, v] of Object.entries(w)) {
      const tr = el('tr');
      tr.append(el('td', null, k), el('td', 'v', `${v} ${r.weather.units?.[k] ?? ''}`.trim()));
      t.append(tr);
    }
    d.append(t); box.append(d);
  }
  node.append(box);
}

async function send(text) {
  add('user', text);
  const pending = add('bot', 'Checking live weather…');
  // The demo runs on a free instance that sleeps when idle; say so instead of
  // leaving a spinner for the minute it takes to wake.
  const slow = setTimeout(() => {
    pending.textContent = 'Still working. The free server may be waking up, which takes up to a minute…';
  }, 6000);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: session, message: text }),
    });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = typeof r.detail === 'string' ? r.detail : r.error;
      throw new Error(detail || `server returned ${res.status}`);
    }
    clearTimeout(slow);
    pending.textContent = r.answer;
    decorate(pending, r);
  } catch (err) {
    clearTimeout(slow);
    pending.textContent = err instanceof TypeError
      ? 'Cannot reach the backend. Start it with  uvicorn app.api:app --port 8000  and open http://localhost:8000'
      : `Error: ${err.message}`;
  }
  log.scrollTop = log.scrollHeight;
}

document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
};

document.getElementById('reset').onclick = () => {
  session = crypto.randomUUID();
  log.replaceChildren();
  add('bot', 'New session. Earlier turns are forgotten.');
};

// Opened by double-clicking the file: relative API calls have nowhere to go.
if (location.protocol === 'file:') {
  add('bot', 'This page has to be served by the backend, not opened as a file.\n\n' +
    'From the repo root run:  uvicorn app.api:app --port 8000\n' +
    'then open http://localhost:8000');
  document.getElementById('input').disabled = true;
}

const meta = document.getElementById('meta');
const waking = setTimeout(() => { meta.textContent = 'Waking the free server up (about a minute)…'; }, 2500);
fetch('/health').then(r => r.json())
  .then(h => { clearTimeout(waking); meta.textContent = h.error ? h.error : `${h.sops} SOPs loaded`; })
  .catch(() => clearTimeout(waking));
</script>
</body>
</html>
