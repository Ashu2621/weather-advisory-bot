events {}

http {
  upstream advisory {
    server app1:8000;
    server app2:8000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://advisory;
      # The app rate-limits on the last X-Forwarded-For hop, the one added here.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
      # Lets the stack check see which replica answered.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
