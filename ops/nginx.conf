events {}

http {
  # Re-resolve the replicas: a recreated container gets a new address, and nginx
  # otherwise keeps sending to the old one (502s after every redeploy).
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream advisory {
    zone advisory 64k;
    server app1:8000 resolve;
    server app2:8000 resolve;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://advisory;
      # The app rate-limits on the last X-Forwarded-For hop, the one added here.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
      # Lets the stack check see which replica answered.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
