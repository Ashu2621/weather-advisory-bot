name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app evals ops loadtest
      # Offline cases only. `live` needs GEMINI_API_KEY; `remote` runs nightly
      # against the deployed demo (live-eval.yml).
      - run: pytest evals -m "not live and not remote" -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t advisory .
      - name: Boot and check /health
        run: |
          docker run -d --name bot -p 8000:8000 advisory
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs bot
          exit 1

  # Two replicas behind nginx on shared Postgres and Redis: memory, rate limit and
  # audit must hold across replicas, and both must start together on an empty DB.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f ops/compose.yml up -d --build --wait
      - run: docker compose -f ops/compose.yml run --rm --no-deps check
      - name: Alert rules parse
        run: docker run --rm -v "$PWD/ops:/ops:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /ops/alerts.yml
      - if: failure()
        run: docker compose -f ops/compose.yml logs --tail 80
