name: Live evals

# The live cases, against the deployed demo and its real model. No key is needed
# here: the deployment uses its own. Costs about 20 model calls of the demo's quota.
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote:
    runs-on: ubuntu-latest
    env:
      EVAL_BASE_URL: https://weather-advisory-bot-5evh.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest evals -m remote -v
